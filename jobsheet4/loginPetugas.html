<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Simpus Mini</title>
</head>
<body>
    <h1>Simpus mini</h1>
    <main>
        <section class="login-card">
            <h2>Login Petugas</h2>
            <form action="index.html" method="post">
                <p>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Masukan username petugas">
                </p>
                <p>
                    <label for="password">Pasword</label>
                    <input type="password" id="password" name="password" required placeholder="Masukan Password">
                </p>
                <p>
                    <button type="submit" class="btn-full">Masuk</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Simpus-Mini</p>
    </footer>
</body>
</html>
